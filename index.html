<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Pastel Parallax</title>
	<link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
	<section class="ingredients parallax"><!--this is the whole section aka background-->
		<div class="card"><!--This will be the background of text-->
		<h1>These are the ingredients.</h1>
		<p>Let's prepare....</p>
		</div>
	</section>

	<section class="prep parallax"><!--this is the whole section aka background-->
		<div class="card"><!--This will be the background of text-->
		<h1>We will prep each ingredients.</h1>
		<p>Now let's cook!!</p>
		</div>
	</section>

	<section class="cook parallax"><!--this is the whole section aka background-->
		<div class="card"><!--This will be the background of text-->
		<h1>We will cook on midium heat.</h1>
		<p>WOWWWW.. looking good so far crodie</p>
		</div>
	</section>

	<section class="finish parallax"><!--this is the whole section aka background-->
		<div class="card"><!--This will be the background of text-->
		<h1>YUMMM</h1>
		</div>
	</section>

</body>
</html>
